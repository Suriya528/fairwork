name: FairWork Production Quality & Security Gates

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]

jobs:
  backend-gate:
    name: Backend Invariant & Settlement Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: fairwork-backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./fairwork-backend
        run: npm ci

      - name: Run Backend Invariant Tests
        working-directory: ./fairwork-backend
        run: npm test

      - name: Security Audit
        working-directory: ./fairwork-backend
        run: npm audit --audit-level=high

  frontend-gate:
    name: Frontend Typecheck & Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: fairwork-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./fairwork-frontend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: ./fairwork-frontend
        run: npm run lint

      - name: Vite Production Build
        working-directory: ./fairwork-frontend
        run: npm run build

      - name: Security Audit
        working-directory: ./fairwork-frontend
        run: npm audit --audit-level=high

  blockchain-gate:
    name: Smart Contract Compile & Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: fairwork-blockchain/package-lock.json

      - name: Install Dependencies
        working-directory: ./fairwork-blockchain
        run: npm ci

      - name: Compile Solidity Contracts
        working-directory: ./fairwork-blockchain
        run: npx hardhat compile

      - name: Run Contract Tests
        working-directory: ./fairwork-blockchain
        run: npx hardhat test
