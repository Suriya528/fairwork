<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FairWork — blockchain-powered freelancer payment protection. Escrow-backed milestones, automatic releases, and fair dispute resolution."
    />
    <meta name="theme-color" content="#030712" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><path d='M20 3.5L34 9.5V20.5C34 28.8 28.1 35.8 20 38.5C11.9 35.8 6 28.8 6 20.5V9.5L20 3.5Z' fill='%232563eb' fill-opacity='0.2' stroke='%232563eb' stroke-width='2.5'/><path d='M13.5 14H24.5M13.5 14V26M13.5 20H21.5' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/><path d='M20.5 26L23.5 19.5L26.5 26L29.5 19.5' stroke='%2310b981' stroke-width='2.5' stroke-linecap='round'/><circle cx='20.5' cy='14' r='2' fill='%2310b981'/></svg>" />
    <title>FairWork — Escrow-Backed Freelance Payments</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('fairwork-theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
