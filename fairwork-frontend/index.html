<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FairWork — blockchain-powered freelancer payment protection. Escrow-backed milestones, automatic releases, and fair dispute resolution."
    />
    <meta name="theme-color" content="#030712" />
    <title>FairWork — Escrow-Backed Freelance Payments</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('fairwork-theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
